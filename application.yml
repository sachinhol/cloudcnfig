spring:
  datasource:
    url: jdbc:mysql://localhost:3306/university
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  instance:
    ip-address: true
  client:
    fetch-registry: true
    service-url:
      defaultZone : ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}


management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0  # Log 100% of requests (Great for Dev, bad for Prod)
    zipkin:
      tracing:
        endpoint: "http://localhost:9411/api/v2/spans" # Where to send the reports