spring:
  datasource:
    url: jdbc:mysql://localhost:3306/university
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8082

eureka:
  prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

management:
  tracing:
    sampling:
      probability: 1.0  # Log 100% of requests (Great for Dev, bad for Prod)
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans" # Where to send the reports